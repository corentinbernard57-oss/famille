<!DOCTYPE html> 
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>🏠 Famille</title>

<meta name="robots" content="noindex,nofollow">

<!-- PWA -->
<meta name="theme-color" content="#2f6f62">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Famille">

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">

<link
  rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A1%3C/text%3E%3C/svg%3E"
>

<style>

/* =========================================================
   VARIABLES
   ========================================================= */

:root{
  --bg:#f6f5f2;
  --card:#fff;
  --ink:#222;
  --muted:#837f78;
  --line:#e8e6e1;
  --accent:#2f6f62;
  --soft:#e4efec;
  box-sizing:border-box;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171716;
    --card:#232322;
    --ink:#f1f0ec;
    --muted:#a09c94;
    --line:#33322f;
    --accent:#6fbfae;
    --soft:#26332f;
  }
}

:root[data-theme="dark"]{
  --bg:#171716;
  --card:#232322;
  --ink:#f1f0ec;
  --muted:#a09c94;
  --line:#33322f;
  --accent:#6fbfae;
  --soft:#26332f;
}

*{
  box-sizing:border-box;
}

html{
  scroll-padding-top:env(safe-area-inset-top,0px);
}

body{
  margin:0;
  padding-top:env(safe-area-inset-top,0px);
  background:var(--bg);
  color:var(--ink);
  font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}

/* =========================================================
   BOUTONS
   ========================================================= */

button{
  font:inherit;
  border:0;
  cursor:pointer;
  color:inherit;
  background:none;
  transition:
    transform .12s ease,
    background-color .2s,
    border-color .2s,
    box-shadow .2s,
    color .2s;
  -webkit-tap-highlight-color:transparent;
}

button:focus-visible{
  outline:3px solid #f2b134;
  outline-offset:2px;
}

.primary{
  background:var(--accent);
  color:#fff;
  border-radius:12px;
  padding:13px 18px;
  font-weight:600;
  border:3px solid transparent;
}

.primary:active{
  transform:scale(.95);
  border-color:#f2b134;
}

.link{
  color:var(--accent);
  font-weight:600;
  display:block;
  margin:14px auto 0;
  padding:8px;
}

.link:active{
  transform:scale(.95);
}

/* =========================================================
   PARAMÈTRES
   ========================================================= */

.settings-btn{
  position:fixed;
  top:calc(12px + env(safe-area-inset-top,0px));
  right:16px;
  width:44px;
  height:44px;
  border-radius:50%;
  background:var(--card);
  color:var(--ink);
  font-size:1.35rem;
  display:none;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
  z-index:30;
}

body.in .settings-btn{
  display:flex;
}

.settings-btn:active{
  transform:scale(.9);
}

@media (hover:hover){
  .settings-btn:hover{
    background:var(--soft);
    transform:scale(1.08);
  }
}

/* =========================================================
   PANNEAU PARAMÈTRES
   ========================================================= */

.settings-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:25;
}

.settings-overlay.open{
  display:flex;
}

.settings-panel{
  width:100%;
  max-width:560px;
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  color:var(--ink);
  border-radius:22px 22px 0 0;
  padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));
  animation:settingsIn .2s ease;
}

@keyframes settingsIn{
  from{
    opacity:0;
    transform:translateY(30px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.settings-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
}

.settings-header h2{
  margin:0;
  font-size:1.35rem;
}

.settings-close{
  width:40px;
  height:40px;
  border-radius:50%;
  background:var(--soft);
  font-size:1.2rem;
}

.settings-user{
  background:var(--soft);
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
}

.settings-user strong{
  display:block;
}

.settings-user small{
  color:var(--muted);
  overflow-wrap:anywhere;
}

.settings-list{
  display:grid;
  gap:8px;
}

.settings-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  padding:14px;
  border-radius:14px;
  background:var(--bg);
}

.settings-item span:first-child{
  width:34px;
  text-align:center;
  font-size:1.3rem;
}

.settings-item div{
  flex:1;
}

.settings-item strong{
  display:block;
}

.settings-item small{
  color:var(--muted);
}

.settings-logout{
  margin-top:14px;
  width:100%;
  color:#d9534f;
  background:rgba(217,83,79,.08);
  padding:13px;
  border-radius:12px;
  font-weight:600;
}

/* =========================================================
   CONTENU
   ========================================================= */

main{
  max-width:560px;
  margin:0 auto;
  padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));
}

h1{
  font-size:1.5rem;
  margin:8px 0 16px;
  font-weight:650;
}

.card{
  background:var(--card);
  border-radius:16px;
  padding:6px 16px;
  box-shadow:0 1px 2px rgba(0,0,0,.05);
}

/* =========================================================
   PLANNING
   ========================================================= */

.week{
  display:flex;
  align-items:center;
  gap:4px;
  margin-bottom:14px;
}

.week .arrow{
  padding:10px 12px;
  color:var(--muted);
  font-size:1.1rem;
}

.strip{
  flex:1;
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
}

.day{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:8px 0;
  border-radius:12px;
  font-size:.75rem;
  color:var(--muted);
  position:relative;
}

.day b{
  font-size:1.1rem;
  color:var(--ink);
  font-weight:600;
}

.day.sel{
  background:var(--accent);
  color:#fff;
}

.day.sel b{
  color:#fff;
}

.day.today b{
  color:var(--accent);
}

.day.sel.today b{
  color:#fff;
}

.day i{
  position:absolute;
  bottom:3px;
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--accent);
}

.day.sel i{
  background:#fff;
}

.sub{
  color:var(--muted);
  font-size:.9rem;
  margin:0 2px 8px;
  text-transform:capitalize;
}

.row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 0;
  border-top:1px solid var(--line);
  animation:pop .25s ease;
  transition:background-color .2s;
}

.row:first-child{
  border-top:0;
}

@keyframes pop{
  from{
    opacity:0;
    transform:translateY(6px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.time{
  font-weight:650;
  min-width:3.2em;
  white-space:nowrap;
  color:var(--accent);
}

.grow{
  flex:1;
  min-width:0;
  overflow-wrap:anywhere;
}

.tag{
  font-size:.75rem;
  padding:3px 10px;
  border-radius:999px;
  background:var(--soft);
  color:var(--accent);
  white-space:nowrap;
}

.del{
  color:var(--muted);
  padding:4px 8px;
}

.empty{
  color:var(--muted);
  text-align:center;
  padding:28px 0;
}

/* =========================================================
   BOUTON +
   ========================================================= */

.fab{
  position:fixed;
  right:max(16px,calc(50% - 264px));
  bottom:calc(84px + env(safe-area-inset-bottom,0px));
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--accent);
  color:#fff;
  font-size:2rem;
  line-height:1;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
  z-index:4;
}

.fab:active{
  transform:scale(.9);
}

/* =========================================================
   NAVIGATION
   ========================================================= */

nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:var(--card);
  border-top:1px solid var(--line);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom,0px);
  z-index:10;
}

nav button{
  flex:1;
  padding:12px 0 10px;
  color:var(--muted);
  font-size:.8rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
}

nav button span{
  font-size:1.4rem;
  width:3.6rem;
  height:2.2rem;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
}

nav button.on{
  color:var(--accent);
  font-weight:600;
}

nav button.on span{
  background:color-mix(in srgb,var(--accent) 20%,transparent);
}

/* =========================================================
   FENÊTRE AJOUT
   ========================================================= */

.sheet{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:20;
}

.sheet.open{
  display:flex;
}

.sheet form{
  background:var(--card);
  width:100%;
  max-width:560px;
  border-radius:20px 20px 0 0;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  max-height:92vh;
  overflow:auto;
}

.sheet .full{
  grid-column:1/-1;
}

.cap{
  display:block;
  font-size:.75rem;
  color:var(--muted);
  margin:0 0 4px 2px;
}

.rng{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

input[type=text],
input[type=date],
input[type=time],
input[type=email],
input[type=password]{
  font:inherit;
  padding:13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--bg);
  color:var(--ink);
  width:100%;
  min-width:0;
}

.chk{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:.95rem;
}

.chk input{
  width:24px;
  height:24px;
  accent-color:var(--accent);
}

/* =========================================================
   COURSES
   ========================================================= */

.add{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.add input{
  flex:1;
}

.box{
  width:28px;
  height:28px;
  accent-color:var(--accent);
  flex:none;
}

.done .grow{
  text-decoration:line-through;
  color:var(--muted);
}

@keyframes flash{
  0%{
    border-color:transparent;
    transform:scale(1);
  }
  25%{
    border-color:#f2b134;
    transform:scale(.96);
  }
  60%{
    border-color:#3fae6a;
    background:#3fae6a;
    transform:scale(1.03);
  }
  100%{
    border-color:transparent;
    transform:scale(1);
  }
}

.flash{
  animation:flash .7s ease;
}

/* =========================================================
   LOGIN
   ========================================================= */

#login{
  display:none;
  padding:24px 16px;
}

body.out #login{
  display:block;
}

body:not(.in) main,
body:not(.in) nav,
body:not(.in) .sheet{
  display:none!important;
}

.lbox{
  max-width:380px;
  margin:12vh auto 0;
  text-align:center;
}

.lbox form{
  display:grid;
  gap:12px;
  margin-top:18px;
}

.err{
  color:#d9534f;
  font-size:.9rem;
  min-height:1.2em;
  margin:0;
}

.sep{
  display:flex;
  align-items:center;
  gap:12px;
  color:var(--muted);
  font-size:.8rem;
  margin:18px 0 14px;
}

.sep::before,
.sep::after{
  content:"";
  flex:1;
  height:1px;
  background:var(--line);
}

.gbtn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  background:var(--card);
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 18px;
  font-weight:600;
}

.gbtn svg{
  width:20px;
  height:20px;
  flex:none;
}

.gbtn:active{
  transform:scale(.95);
}

.gbtn[disabled]{
  opacity:.55;
  cursor:default;
}

#status{
  text-align:center;
  font-size:.78rem;
  color:var(--muted);
  margin-top:18px;
}

[hidden]{
  display:none!important;
}

/* =========================================================
   HOVER
   ========================================================= */

@media (hover:hover){

  .primary:hover{
    background:var(--accent);
    transform:translateY(-2px) scale(1.03);
    box-shadow:0 6px 16px rgba(0,0,0,.15);
  }

  .day:hover:not(.sel){
    background:var(--soft);
    transform:translateY(-2px);
  }

  nav button:hover{
    color:var(--accent);
    transform:translateY(-2px);
  }

  .del:hover{
    color:#d9534f;
    transform:scale(1.2);
  }

  .arrow:hover{
    color:var(--accent);
    transform:scale(1.2);
  }

  .link:hover{
    transform:scale(1.05);
    text-decoration:underline;
  }

  .row:hover{
    background:var(--soft);
  }

  .gbtn:not([disabled]):hover{
    border-color:var(--accent);
    transform:translateY(-2px) scale(1.02);
    box-shadow:0 6px 16px rgba(0,0,0,.12);
  }
}

@media (prefers-reduced-motion:reduce){

  *{
    animation:none!important;
    transition:none!important;
  }

}

</style>
</head>

<body class="wait">

<!-- =========================================================
     BOUTON PARAMÈTRES
     ========================================================= -->

<button
  id="settingsBtn"
  class="settings-btn"
  aria-label="Paramètres"
  title="Paramètres"
>
  ⚙️
</button>


<!-- =========================================================
     CONNEXION
     ========================================================= -->

<div id="login">

    <h1>🏡 Famille</h1>

    <p class="sub">
      Connecte-toi pour voir le planning et les courses.
    </p>

      <input
        type="email"
        id="le"
        placeholder="Adresse e-mail"
        autocomplete="username"

        aria-label="Adresse e-mail"

      <input
        type="password"
        id="lp"
        placeholder="Mot de passe"
        autocomplete="current-password"
        required
        aria-label="Mot de passe"
      >

      <button class="primary" type="submit">
        Se connecter
      </button>

    </form>

    <div class="sep">ou</div>

    <button
      class="gbtn"
      type="button"
      id="lg"
    >

      <svg viewBox="0 0 48 48" aria-hidden="true">

        <path fill="#FFC107"
          d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.5z"/>

        <path fill="#4CAF50"

        <path fill="#1976D2"
          d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 40.2 44 35 44 24c0-1.3-.1-2.6-.4-3.5z"/>

      </svg>

      Continuer avec Google

    </button>

    <p class="err" id="lerr"></p>

  </div>

</div>


<!-- =========================================================
     APPLICATION
     ========================================================= -->

<main>

<section id="p-plan">

  <h1>Planning</h1>

  <div class="week">

    <button
      class="arrow"
      id="prev"
      aria-label="Semaine précédente"
    >
      ‹
    </button>

    <div class="strip" id="strip"></div>

    <button
      class="arrow"
      id="next"
      aria-label="Semaine suivante"
    >
      ›
    </button>

  </div>

  <p class="sub" id="dlabel"></p>

  <div class="card" id="evs"></div>

  <button
    class="primary"
    id="now"
    style="display:block;width:100%;margin-top:16px"
  >
    Revenir à aujourd’hui
  </button>

  <button
    class="fab"
    id="fab"
    aria-label="Ajouter un rendez-vous"
  >
    +
  </button>

</section>


<section id="p-shop" hidden>

  <h1>Courses</h1>

  <form class="add" id="sf">

    <input
      type="text"
      id="si"
      placeholder="Ajouter un article…"
      aria-label="Article"
    >

    <button class="primary" type="submit">
      Ajouter
    </button>

  </form>

  <div class="card" id="items"></div>

  <button
    class="primary"
    id="fin"
    style="width:100%;margin-top:16px"
    hidden
  >
    ✓ Courses faites
  </button>

  <button
    class="link"
    id="clr"
    hidden
  >
    Retirer les articles cochés
  </button>

</section>


<p id="status"></p>

<button class="link" id="logout">
  Se déconnecter
</button>

</main>


<!-- =========================================================
     NAVIGATION
     ========================================================= -->

<nav>

  <button id="n-plan" class="on">
    <span>📅</span>
    Planning
  </button>

  <button id="n-shop">
    <span>🛒</span>
    Courses
  </button>

</nav>


<!-- =========================================================
     FENÊTRE AJOUT RENDEZ-VOUS
     ========================================================= -->

<div class="sheet" id="sheet">

<form id="f">

  <input
    class="full"
    type="text"
    id="t"
    placeholder="Quoi ? (médecin, marché…)"
    required
    aria-label="Titre"
  >

  <div>

    <span class="cap startcap" hidden>
      Du
    </span>

    <input
      type="date"
      id="d"
      required
      aria-label="Date de début"
    >

  </div>

  <div>

    <span class="cap startcap" hidden>
      À partir de
    </span>

    <input
      type="time"
      id="h"
      aria-label="Heure de début"
    >

  </div>

  <label class="chk full">

    <input type="checkbox" id="rg">

    Ajouter une fin (date ou heure)

  </label>

  <div class="full rng" id="rng" hidden>

    <div>

      <span class="cap">
        Jusqu’au
      </span>

      <input
        type="date"
        id="ed"
        aria-label="Date de fin"
      >

    </div>

    <div>

      <span class="cap">
        Jusqu’à
      </span>

      <input
        type="time"
        id="eh"
        aria-label="Heure de fin"
      >

    </div>

  </div>

  <input
    class="full"
    type="text"
    id="w"
    placeholder="Pour qui ? (Maman, Papa…)"
    aria-label="Pour qui"
  >

  <label class="chk full">

    <input type="checkbox" id="r">

    Chaque semaine

  </label>

  <button type="button" id="cancel">
    Annuler
  </button>

  <button class="primary" type="submit">
    Ajouter
  </button>

</form>

</div>


<!-- =========================================================
     PARAMÈTRES
     ========================================================= -->

<div class="settings-overlay" id="settingsOverlay">

  <div class="settings-panel" role="dialog" aria-modal="true">

    <div class="settings-header">

      <h2>⚙️ Paramètres</h2>

      <button
        class="settings-close"
        id="settingsClose"
        aria-label="Fermer"
      >
        ✕
      </button>

    </div>


    <div class="settings-user">

      <strong id="settingsName">
        Compte connecté
      </strong>

      <small id="settingsEmail">
        —
      </small>

    </div>


    <div class="settings-list">

      <button class="settings-item" type="button">

        <span>👤</span>

        <div>
          <strong>Compte</strong>
          <small>Informations du compte</small>
        </div>

        <span>›</span>

      </button>


      <button class="settings-item" type="button">

        <span>🔔</span>

        <div>

  /* =======================================================
     DATES
     ======================================================= */

  function iso(d){

    var m =
      d.getMonth()+1;

    var j =
      d.getDate();

    return (
      d.getFullYear()+
      '-' +
      (m<10?'0':'')+
      m+
      '-' +
      (j<10?'0':'')+
      j
    );

  }


  function parse(s){

    if(!s){
      return new Date();
    }

    var p =
      s.split('-');

    return new Date(
      +p[0],
      p[1]-1,
      +p[2]
    );

  }


  function mondayOf(d){

    var x =
      new Date(
        d.getFullYear(),
        d.getMonth(),
        d.getDate()
      );

    x.setDate(
      x.getDate()-
      (x.getDay()+6)%7
    );

    return x;

  }


  /* =======================================================
     FIRESTORE
     ======================================================= */

  function firestoreCollection(name){

    var c =
      collection(
        fdb,
        name
      );

    return {

      add:function(o){
        return addDoc(c,o);
      },

      doc:function(id){

        var d =
          doc(
            fdb,
            name,
            id
          );

        return {

          set:function(o){
            return setDoc(d,o);
          },

          delete:function(){
            return deleteDoc(d);
          }

        };

      },

      onSnapshot:function(ok,bad){
        return onSnapshot(c,ok,bad);
      }

    };

  }


  /* =======================================================
     STOCKAGE
     ======================================================= */

  function store(name,render){

    var s = {

      items:[],

      col:null,

      unsub:null,

      KEY:
        'famille-'+name

    };


    try{

      s.items =
        JSON.parse(
          localStorage.getItem(s.KEY) || '[]'
        ) || [];

    }
    catch(e){

      s.items=[];

    }


    function save(){

      try{

        localStorage.setItem(
          s.KEY,
          JSON.stringify(s.items)
        );

      }
      catch(e){

        console.error(
          'LocalStorage:',
          e
        );

      }

    }


    function handleError(error){

      console.error(
        'Firestore:',
        error
      );

      $('status').textContent =
        'Accès impossible : vérifie les droits Firestore.';

    }


    s.add=function(o){

      if(s.col){

        s.col
          .add(o)
          .catch(handleError);

      }
      else{

        o.id =
          'l'+
          Date.now()+
          Math.random();

        s.items.push(o);

        save();

        render();

      }

    };


    s.set=function(id,o){

      if(s.col){

        s.col
          .doc(id)
          .set(o)
          .catch(handleError);

      }
      else{

        s.items =
          s.items.map(
            function(x){

              return x.id===id
                ? Object.assign(
                    {id:id},
                    o
                  )
                : x;

            }
          );

        save();

        render();

      }

    };


    s.del=function(id){

      if(s.col){

        s.col
          .doc(id)
          .delete()
          .catch(handleError);

      }
      else{

        s.items =
          s.items.filter(
            function(x){
              return x.id!==id;
            }
          );

        save();

        render();

      }

    };


    s.connect=function(){

      if(s.unsub){
        s.unsub();
      }

      s.col =
        firestoreCollection(name);


      s.unsub =
        s.col.onSnapshot(

          function(sn){

            s.items =
              sn.docs.map(
                function(d){

                  return Object.assign(
                    {},
                    d.data(),
                    {
                      id:d.id
                    }
                  );

                }
              );


            $('status').textContent =
              'Partagé en direct avec la famille';

            render();

          },

          function(error){

            handleError(error);

            s.col=null;

            render();

          }

        );

    };


    s.disconnect=function(){

      if(s.unsub){

        s.unsub();

      }

      s.unsub=null;

      s.col=null;

      s.items=[];

      render();

    };


    return s;

  }

  function authErr(er,fallback){

    var c =
      er &&
      er.code;


    if(c==='auth/too-many-requests'){
      return 'Trop d’essais. Réessaie dans quelques minutes.';
    }

    if(c==='auth/network-request-failed'){
      return 'Pas de connexion internet.';
    }

    if(c==='auth/unauthorized-domain'){
      return 'Ce site n’est pas autorisé dans Firebase.';
    }

    if(c==='auth/account-exists-with-different-credential'){
      return 'Ce compte existe déjà avec un autre moyen de connexion.';
    }

    if(c==='auth/invalid-credential'){
      return 'Les informations de connexion sont invalides.';
    }

    return fallback;

  }

        function(er){

          var c =

            er.code;


          if(
            c==='auth/popup-closed-by-user' ||
            c==='auth/cancelled-popup-request'
          ){

            $('lg').disabled=false;

  function emoji(t){

    var n =
      (t||'')
        .toLowerCase()
        .normalize('NFD')
        .replace(
          /[\u0300-\u036f]/g,
          ''
        );


    for(
      var i=0;
      i<EMO.length;
      i++
    ){

      if(
        n.indexOf(
          EMO[i][0]
        )>-1
      ){

        return EMO[i][1];

      }

    }

    return '📌';

  }


  /* =======================================================
     PLANNING
     ======================================================= */

  var sel =
    new Date();


  var DOW=[

    'lun.',
    'mar.',
    'mer.',
    'jeu.',
    'ven.',
    'sam.',
    'dim.'

  ];


  function forDay(d){

    var s =
      iso(d);

    var w =
      d.getDay();


    return ev.items

      .filter(
        function(e){

          return (

            e.date===s

            ||

            (
              e.endDate &&
              e.date<s &&
              s<=e.endDate
            )

            ||

            (
              e.weekly &&
              !e.endDate &&
              e.date<s &&
              parse(e.date).getDay()===w
            )

          );

        }
      )

      .sort(
        function(a,b){

          return (
            a.time||'99'
          ).localeCompare(
            b.time||'99'
          );

        }
      );

  }


  function renderPlan(){

    var m =
      mondayOf(sel);

    var strip =
      $('strip');

    if(!strip){
      return;
    }

      iso(new Date());

    strip.innerHTML='';


    for(
      var i=0;
      i<7;
      i++
    ){

      (function(index){

        var d =
          new Date(m);

        d.setDate(
          m.getDate()+index
        );


        var b =
          document.createElement('button');


        b.className =
          'day' +

          (
            iso(d)===iso(sel)
            ? ' sel'
            : ''
          ) +

          (
            iso(d)===today
            ? ' today'
            : ''
          );


        b.innerHTML =
          DOW[index]+
          '<b>'+
          d.getDate()+
          '</b>'+

          (
            forDay(d).length
            ? '<i></i>'
            : ''
          );


        b.onclick =
          function(){

              new Date(d);

            renderPlan();

          };


        strip.appendChild(b);

      })(i);

        $('si').value.trim();


      if(!v){
        return;
      }


      sh.add({

        t:v,

        done:false,

        at:Date.now()

      });


      $('si').value='';

    };


  /* =======================================================
     COURSES FAITES
     ======================================================= */

  $('fin').onclick =
    function(){

      var b =
        $('fin');


      b.classList.remove('flash');

      void b.offsetWidth;

      b.classList.add('flash');


      var list =
        sh.items.slice();


      setTimeout(
        function(){

          list.forEach(
            function(x){

              sh.del(x.id);

            }
          );

        },
        650
      );

    };


  /* =======================================================
     ARTICLES COCHÉS
     ======================================================= */

  $('clr').onclick =
    function(){

      sh.items
        .filter(
          function(x){
            return x.done;
          }
        )
        .forEach(
          function(x){
            sh.del(x.id);
          }
        );

    };


  /* =======================================================
     ONGLETS
     ======================================================= */

  function tab(n){

    $('p-plan').hidden =
      n!=='plan';

    $('p-shop').hidden =
      n!=='shop';

    $('n-plan').className =
      n==='plan'
      ? 'on'
      : '';

    $('n-shop').className =
      n==='shop'
      ? 'on'
      : '';

    window.scrollTo(0,0);

  }


  $('n-plan').onclick =
    function(){
      tab('plan');
    };


  $('n-shop').onclick =
    function(){
      tab('shop');
    };


  /* =======================================================
     INITIALISATION
     ======================================================= */

  syncRg();

  renderPlan();

  renderShop();

})();


/* =========================================================
   SERVICE WORKER
   ========================================================= */

if(
  "serviceWorker" in navigator
){

  window.addEventListener(
    "load",
    function(){

      navigator.serviceWorker
        .register("./sw.js")
        .then(
          function(registration){

            console.log(
              "Service Worker actif :",
              registration.scope
            );

          }
        )
        .catch(
          function(error){

            console.error(
              "Erreur Service Worker :",
              error
            );

          }
        );

    }
  );

}

</script>
