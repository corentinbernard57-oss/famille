  60%{

  100%{
    border-color:transparent;

}

<script type="module">

/* =========================================================

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,

  signInWithPopup,
  signInWithRedirect,
  getRedirectResult,
  signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  addDoc,
  setDoc,
  deleteDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


/* =========================================================
   CONFIGURATION FIREBASE
   ========================================================= */

const firebaseConfig = {

  apiKey: "AIzaSyB-i4s5EczUmK1e3GY9lEzrzZgG4b94Gu4",

  authDomain:
    "famille-bernard.firebaseapp.com",

  projectId:
    "famille-bernard",

  storageBucket:
    "famille-bernard.firebasestorage.app",

  messagingSenderId:
    "878836991029",

  appId:
    "1:878836991029:web:0ad3cd93453f29b9611d7c"

};


/* =========================================================
   INITIALISATION FIREBASE
   ========================================================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const fdb =
  getFirestore(app);


/* =========================================================
   APPLICATION
   ========================================================= */

(function(){

  function $(id){
    return document.getElementById(id);
  }


  /* =======================================================
     DATES
     ======================================================= */

  function iso(d){

    var m =
      d.getMonth()+1;

    var j =
      d.getDate();

    return (
      d.getFullYear()+
      '-' +
      (m<10?'0':'')+
      m+
      '-' +
      (j<10?'0':'')+
      j
    );

  }


  function parse(s){

    var p =
      s.split('-');

    return new Date(
      +p[0],
      p[1]-1,
      +p[2]
    );

  }


  function mondayOf(d){

    var x =
      new Date(
        d.getFullYear(),
        d.getMonth(),
        d.getDate()
      );

    x.setDate(
      x.getDate()-
      (x.getDay()+6)%7
    );

    return x;

  }


  /* =======================================================
     FIRESTORE
     ======================================================= */

  function firestoreCollection(name){

    var c =
      collection(
        fdb,
        name
      );

    return {

      add:function(o){

        return addDoc(
          c,
          o
        );

      },


      doc:function(id){

        var d =
          doc(
            fdb,
            name,
            id
          );

        return {

          set:function(o){

            return setDoc(
              d,
              o
            );

          },


          delete:function(){

            return deleteDoc(
              d
            );

          }

        };

      },


      onSnapshot:function(ok,bad){

        return onSnapshot(
          c,
          ok,
          bad
        );

      }

    };

  }


  /* =======================================================
     STOCKAGE
     ======================================================= */

  function store(name,render){

    var s = {

      items:[],

      col:null,

      KEY:
        'famille-'+name

    };


    try{

      s.items =
        JSON.parse(
          localStorage.getItem(
            s.KEY
          ) || '[]'
        ) || [];

    }
    catch(e){

      s.items=[];

    }


    function save(){

      try{

        localStorage.setItem(
          s.KEY,
          JSON.stringify(
            s.items
          )
        );

      }
      catch(e){}

    }


    function err(p){

      if(
        p &&
        p.catch
      ){

        p.catch(
          function(){

            $('status').textContent =
              'Modification impossible (droits insuffisants ?).';

          }
        );

      }

    }


    s.add=function(o){

      if(s.col){

        err(
          s.col.add(o)
        );

      }
      else{

        o.id =
          'l'+
          Date.now()+
          Math.random();

        s.items.push(o);

        save();

        render();

      }

    };


    s.set=function(id,o){

      if(s.col){

        err(
          s.col
            .doc(id)
            .set(o)
        );

      }
      else{

        s.items =
          s.items.map(
            function(x){

              return x.id===id
                ? Object.assign(
                    {id:id},
                    o
                  )
                : x;

            }
          );

        save();

        render();

      }

    };


    s.del=function(id){

      if(s.col){

        err(
          s.col
            .doc(id)
            .delete()
        );

      }
      else{

        s.items =
          s.items.filter(
            function(x){

              return x.id!==id;

            }
          );

        save();

        render();

      }

    };


    s.connect=function(){

      s.col =
        firestoreCollection(
          name
        );


      s.unsub =
        s.col.onSnapshot(

          function(sn){

            s.items =
              sn.docs.map(
                function(d){

                  return Object.assign(
                    {},
                    d.data(),
                    {
                      id:d.id
                    }
                  );

                }
              );


            $('status').textContent =
              'Partagé en direct avec la famille';


            render();

          },


          function(error){

            console.error(
              'Firestore:',
              error
            );


            s.col=null;


            $('status').textContent =
              'Accès impossible : vérifie les droits Firestore.';


            render();

          }

        );

    };


    s.disconnect=function(){

      if(s.unsub){

        s.unsub();

      }


      s.unsub=null;

      s.col=null;

      s.items=[];

      render();

    };


    return s;

  }

  function authErr(er,fallback){

    var c =
      er &&
      er.code;


    if(
      c==='auth/too-many-requests'
    ){

      return 'Trop d’essais. Réessaie dans quelques minutes.';

    }


    if(
      c==='auth/network-request-failed'
    ){

      return 'Pas de connexion internet.';

    }


    if(
      c==='auth/unauthorized-domain'
    ){

      return 'Ce site n’est pas autorisé dans Firebase.';

    }


    if(
      c==='auth/account-exists-with-different-credential'
    ){

      return 'Ce compte existe déjà avec un autre moyen de connexion.';

    }


    return fallback;

  }

      .then(
        function(){

        }
      )

      .catch(
        function(er){

          var c =
            er &&
            er.code;


          if(
            c==='auth/popup-closed-by-user' ||
            c==='auth/cancelled-popup-request'
          ){

            $('lg').disabled=false;

            return;

          }


          if(
            c==='auth/popup-blocked' ||
            c==='auth/operation-not-supported-in-this-environment'

              auth,
              gprov

            .catch(

  function emoji(t){

    var n =
      (t||'')
        .toLowerCase()
        .normalize('NFD')
        .replace(
          /[\u0300-\u036f]/g,
          ''
        );


    for(
      var i=0;
      i<EMO.length;
      i++
    ){

      if(
        n.indexOf(
          EMO[i][0]
        )>-1
      ){

        return EMO[i][1];

      }

    }


    return '📌';

  }


  /* =======================================================
     PLANNING
     ======================================================= */

  var sel =
    new Date();


  var DOW=[

    'lun.',
    'mar.',
    'mer.',
    'jeu.',
    'ven.',
    'sam.',
    'dim.'

  ];


  function forDay(d){

    var s =
      iso(d);

    var w =
      d.getDay();


    return ev.items

      .filter(
        function(e){

          return (

            e.date===s

            ||

            (
              e.endDate &&
              e.date<s &&
              s<=e.endDate
            )

            ||

            (
              e.weekly &&
              !e.endDate &&
              e.date<s &&
              parse(e.date).getDay()===w
            )

          );

        }
      )

      .sort(
        function(a,b){

          return (
            a.time||'99'
          ).localeCompare(
            b.time||'99'
          );

        }
      );

  }


  function renderPlan(){

    var m =
      mondayOf(sel);


    var strip =
      $('strip');


    var today =
      iso(new Date());


    strip.innerHTML='';


    for(
      var i=0;
      i<7;
      i++
    ){

      (function(){

        var d =
          new Date(m);


        d.setDate(
          m.getDate()+i
        );


        var b =
          document.createElement(
            'button'
          );


        b.className =
          'day' +

          (
            iso(d)===iso(sel)
            ? ' sel'
            : ''
          ) +

          (
            iso(d)===today
            ? ' today'
            : ''
          );


        b.innerHTML =
          DOW[i]+
          '<b>'+
          d.getDate()+
          '</b>'+

          (
            forDay(d).length
            ? '<i></i>'
            : ''
          );


        b.onclick =
          function(){

            sel =
              d;

            renderPlan();

          };


        strip.appendChild(b);

      })();

    }


    $('dlabel').textContent =
      sel.toLocaleDateString(
        'fr-FR',
        {
          weekday:'long',
          day:'numeric',
          month:'long',
          year:'numeric'
        }
      );


    var box =
      $('evs');


    box.innerHTML='';


    var list =
      forDay(sel);


    if(!list.length){

      box.innerHTML =
        '<div class="empty">Rien de prévu ce jour-là</div>';

      return;

    }


    list.forEach(
      function(e){

        var r =
          document.createElement(
            'div'
          );

        r.className='row';


        var t =
          document.createElement(
            'span'
          );

        t.className='time';


        t.textContent =
          e.time
          ? (
              e.time+
              (
                e.endTime
                ? '–'+e.endTime
                : ''
              )
            )
          : '—';


        var g =
          document.createElement(
            'span'
          );

        g.className='grow';


        g.textContent =
          emoji(e.t)+
          ' '+
          e.t+

          (
            e.weekly&&!e.endDate
            ? ' ↻'
            : ''
          )+

          (
            e.endDate &&
            e.endDate>e.date

            ?

            ' · du '+
            parse(e.date).toLocaleDateString(
              'fr-FR',
              {
                day:'numeric',
                month:'short'
              }
            )+
            ' au '+
            parse(e.endDate).toLocaleDateString(
              'fr-FR',
              {
                day:'numeric',
                month:'short'
              }
            )

            :

            ''
          );


        r.appendChild(t);

        r.appendChild(g);


        if(e.who){

          var w =
            document.createElement(
              'span'
            );

          w.className='tag';

          w.textContent =
            e.who;

          r.appendChild(w);

        }


        var x =
          document.createElement(
            'button'
          );

        x.className='del';

        x.textContent='✕';

        x.setAttribute(
          'aria-label',
          'Supprimer'
        );


        x.onclick =
          function(){

            ev.del(e.id);

          };


        r.appendChild(x);

        box.appendChild(r);

      }
    );

  }

  $('f').onsubmit =

      e.preventDefault();


      var o={

        t:
          $('t').value.trim(),

        date:
          $('d').value,

        time:
          $('h').value,

        who:
          $('w').value.trim(),

        weekly:
          $('r').checked,

        endDate:
          $('rg').checked
          ? $('ed').value
          : '',

        endTime:
          $('rg').checked
          ? $('eh').value
          : ''

      };


      if(
        !o.t ||
        !o.date
      ){

        return;

      }


      if(
        o.endDate &&
        o.endDate<o.date
      ){

        $('status').textContent =
          'La date de fin doit être après la date de début.';

        return;

      }


      ev.add(o);


      sel =
        parse(o.date);


      $('t').value='';

      $('h').value='';

      $('ed').value='';

      $('eh').value='';


      $('rg').checked=false;

      syncRg();


      $('r').checked=false;


      $('sheet').classList.remove(
        'open'
      );


      renderPlan();

    };


  /* =======================================================
     COURSES
     ======================================================= */

  function renderShop(){

    var box =
      $('items');


    box.innerHTML='';


    /*
      CORRECTION IMPORTANTE :
      la fonction sort() était mal fermée
      dans ton ancien code.
    */

    var l =
      sh.items
        .slice()
        .sort(
          function(a,b){

            return (
              !!a.done-!!b.done
            ) ||
            (
              a.at-b.at
            );

          }
        );


    $('clr').hidden =
      !l.some(
        function(x){

          return x.done;

        }
      );


    $('fin').hidden =
      !l.length;


    if(!l.length){

      box.innerHTML =
        '<div class="empty">La liste est vide</div>';

      return;

    }


    l.forEach(
      function(it){

        var r =
          document.createElement(
            'div'
          );


        r.className =
          'row'+
          (
            it.done
            ? ' done'
            : ''
          );


        var c =
          document.createElement(
            'input'
          );


        c.type='checkbox';

        c.className='box';

        c.checked =
          !!it.done;


        c.setAttribute(
          'aria-label',
          it.t
        );


        c.onchange =
          function(){

            sh.set(
              it.id,
              {
                t:it.t,
                at:it.at,
                done:c.checked
              }
            );

          };


        var g =
          document.createElement(
            'span'
          );


        g.className='grow';

        g.textContent =
          it.t;


        var x =
          document.createElement(
            'button'
          );


        x.className='del';

        x.textContent='✕';


        x.setAttribute(
          'aria-label',
          'Supprimer '+it.t
        );


        x.onclick =
          function(){

            sh.del(
              it.id
            );

          };


        r.appendChild(c);

        r.appendChild(g);

        r.appendChild(x);


        box.appendChild(r);

      }
    );

  }


  $('sf').onsubmit =
    function(e){

      e.preventDefault();


      var v =
        $('si').value.trim();


      if(!v){

        return;

      }


      sh.add({

        t:v,

        done:false,

        at:Date.now()

      });


      $('si').value='';


      renderShop();

    };


  /* =======================================================
     COURSES FAITES
     ======================================================= */

  $('fin').onclick =
    function(){

      var b =
        $('fin');


      b.classList.remove(
        'flash'
      );


      void b.offsetWidth;


      b.classList.add(
        'flash'
      );


      var list =
        sh.items.slice();


      setTimeout(
        function(){

          if(!sh.col){

            list.forEach(
              function(x){

                sh.del(
                  x.id
                );

              }
            );

            return;

          }


          sh.items=[];

          renderShop();


          var p =
            Promise.resolve();


          list.forEach(
            function(x){

              p =
                p.then(
                  function(){

                    return sh.col
                      .doc(x.id)
                      .delete();

                  }
                );

            }
          );


          p.catch(
            function(){

              $('status').textContent =
                'Impossible de vider la liste (droits insuffisants ?).';

            }
          );

        },
        650
      );

    };


  /* =======================================================
     SUPPRIMER LES ARTICLES COCHÉS
     ======================================================= */

  $('clr').onclick =
    function(){

      sh.items
        .filter(
          function(x){

            return x.done;

          }
        )
        .forEach(
          function(x){

            sh.del(
              x.id
            );

          }
        );

    };


  /* =======================================================
     ONGLETS
     ======================================================= */

  function tab(n){

    $('p-plan').hidden =
      n!=='plan';


    $('p-shop').hidden =
      n!=='shop';


    $('n-plan').className =
      n==='plan'
      ? 'on'
      : '';


    $('n-shop').className =
      n==='shop'
      ? 'on'
      : '';


    window.scrollTo(
      0,
      0
    );

  }


  $('n-plan').onclick =
    function(){

      tab('plan');

    };


  $('n-shop').onclick =
    function(){

      tab('shop');

    };


  /* =======================================================
     INITIALISATION
     ======================================================= */

  renderPlan();

  renderShop();

})();
